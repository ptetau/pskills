<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger pdlc board</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#667085;--line:#e3e6eb;--accent:#3a5bd9;--warn:#b45309;--warnbg:#fff4e5;--bad:#c0262d;--badbg:#fdecec;--ok:#1f8a5b;
--s0:#a7b0c0;--s1:#7c8fe0;--s2:#3a5bd9;--s3:#8a5cd6;--s4:#1f8a5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--panel:#1b1f27;--ink:#e7eaf0;--muted:#9aa3b2;--line:#2c323d;--accent:#7d96ff;--warn:#f0a54a;--warnbg:#3a2a12;--bad:#ff7a7f;--badbg:#3b1a1c;--ok:#4cc38a}}
:root[data-theme="dark"]{--bg:#12151b;--panel:#1b1f27;--ink:#e7eaf0;--muted:#9aa3b2;--line:#2c323d;--accent:#7d96ff;--warn:#f0a54a;--warnbg:#3a2a12;--bad:#ff7a7f;--badbg:#3b1a1c;--ok:#4cc38a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sub{color:var(--muted);margin:4px 0 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:28px;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:20px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.two .panel{margin-bottom:0}
.row{margin-bottom:20px}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0;padding-top:0}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.stuck{background:var(--badbg);color:var(--bad)}
.tag.q{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.tag.you{background:var(--warnbg);color:var(--warn)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--bg);border-radius:8px;padding:10px;min-height:120px}
.col h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}
.col h3 i{font-style:normal;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.card.isstuck{border-color:var(--bad);border-left-color:var(--bad);background:var(--badbg)}
.card .t{font-weight:600;margin:2px 0}
.card .m{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:6px;flex-wrap:wrap}
.age.old{color:var(--warn);font-weight:600}
.flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.intent{display:grid;grid-template-columns:240px 1fr 60px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.intent:first-of-type{border-top:0}
@media (max-width:640px){.intent{grid-template-columns:1fr 50px}.intent .bar{grid-column:1/-1;grid-row:2}}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar div{background:var(--c);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border-right:2px solid var(--panel)}
.pct{text-align:right;font-weight:700;font-size:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}
.status{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:600;border-top:0}
</style>
</head>
<body>
<main>
  <h1>ledger · pdlc board</h1>
  <p class="sub">Morning summary, 28 Nov 2026 · 12 changes across 3 intents</p>
  <section class="kpis" id="kpis"></section>
  <section class="two row">
    <div class="panel"><h2>Waits for you</h2><ul class="list" id="you"></ul></div>
    <div class="panel"><h2>Slow movers (7+ days in stage)</h2><table id="slow"></table></div>
  </section>
  <section class="panel"><h2>Pipeline</h2><div class="board" id="board"></div></section>
  <section class="panel"><h2>Intent progress</h2><div id="intents"></div><div class="legend" id="legend"></div></section>
</main>
<script>
const changes=[
{id:"CH-0020",title:"Add CSV export",intent:"IN-0004",stage:"build",owner:"builder",days:3,stuck:false},
{id:"CH-0021",title:"Fix rounding in VAT",intent:"IN-0005",stage:"verify",owner:"builder",days:9,stuck:false},
{id:"CH-0022",title:"Paginate ledger list",intent:"IN-0006",stage:"planned",owner:"test-writer",days:0,stuck:false},
{id:"CH-0023",title:"Role-based access",intent:"IN-0004",stage:"verify",owner:"test-writer",days:4,stuck:false},
{id:"CH-0024",title:"Audit log table",intent:"IN-0005",stage:"verify",owner:"reviewer",days:8,stuck:false},
{id:"CH-0025",title:"Import bank feed",intent:"IN-0006",stage:"tests",owner:"test-writer",days:5,stuck:false},
{id:"CH-0026",title:"Dark mode tokens",intent:"IN-0004",stage:"planned",owner:"builder",days:9,stuck:false},
{id:"CH-0027",title:"Rate limit API",intent:"IN-0005",stage:"planned",owner:"test-writer",days:7,stuck:false},
{id:"CH-0028",title:"Recurring entries",intent:"IN-0006",stage:"show",owner:"you",days:5,stuck:false},
{id:"CH-0029",title:"Attach receipts",intent:"IN-0004",stage:"build",owner:"you",days:5,stuck:true},
{id:"CH-0030",title:"Multi-currency totals",intent:"IN-0005",stage:"show",owner:"test-writer",days:1,stuck:false},
{id:"CH-0031",title:"Close period lock",intent:"IN-0006",stage:"verify",owner:"you",days:5,stuck:false}];
const intents=[{id:"IN-0004",title:"Reports users can trust",status:"building"},{id:"IN-0005",title:"Safer access",status:"building"},{id:"IN-0006",title:"Less manual entry",status:"ready"}];
const questions=[{id:"Q-31",change:"CH-0023",q:"Should role checks apply to read-only exports?",asked:"2026-11-26"},{id:"Q-32",change:"CH-0025",q:"Which bank feed format first: OFX or CSV?",asked:"2026-11-27"},{id:"Q-33",change:"CH-0031",q:"Lock closed periods for admins too?",asked:"2026-11-27"}];
const stages=["planned","tests","build","verify","show"];
const color=s=>`var(--s${stages.indexOf(s)})`;
const byId=Object.fromEntries(changes.map(c=>[c.id,c]));
const qFor=id=>questions.filter(q=>q.change===id);
const today=new Date("2026-11-28");
const ago=d=>{const n=Math.round((today-new Date(d))/864e5);return n===0?"today":n===1?"1 day ago":n+" days ago"};
const $=id=>document.getElementById(id);

const stuck=changes.filter(c=>c.stuck), mine=changes.filter(c=>c.owner==="you"), slow=changes.filter(c=>c.days>=7);
$("kpis").innerHTML=[
 ["bad",stuck.length,"stuck change"+(stuck.length===1?"":"s")],
 ["warn",questions.length,"open questions for you"],
 ["",mine.length,"changes owned by you"],
 ["warn",slow.length,"changes 7+ days in stage"],
 ["",changes.filter(c=>c.stage==="show").length,"ready to show / merge"]
].map(([k,n,l])=>`<div class="kpi ${k}"><b>${n}</b><span>${l}</span></div>`).join("");

// Waits for you: stuck first, then questions, then owned changes not already listed
const items=[];
stuck.forEach(c=>items.push({tag:'<span class="tag stuck">STUCK</span>',body:`<b>${c.title}</b> <span class="mono">${c.id}</span><br><span class="mono">in ${c.stage} for ${c.days} days · owner ${c.owner}</span>`}));
questions.forEach(q=>{const c=byId[q.change];items.push({tag:'<span class="tag q">QUESTION</span>',body:`<b>${q.q}</b><br><span class="mono">${q.id} · ${c.id} ${c.title} (${c.stage}) · asked ${ago(q.asked)}</span>`})});
mine.filter(c=>!c.stuck).forEach(c=>items.push({tag:'<span class="tag you">YOUR TURN</span>',body:`<b>${c.title}</b> <span class="mono">${c.id}</span><br><span class="mono">${c.stage==="show"?"review the recording and merge":"in "+c.stage} · ${c.days} days in stage</span>`}));
$("you").innerHTML=items.map(i=>`<li>${i.tag}<div>${i.body}</div></li>`).join("");

$("slow").innerHTML="<tr><th>Change</th><th>Stage</th><th>Owner</th><th>Days</th></tr>"+
 slow.sort((a,b)=>b.days-a.days).map(c=>`<tr><td><b>${c.title}</b> <span class="mono">${c.id}</span></td><td>${c.stage}</td><td>${c.owner}</td><td class="age old">${c.days}</td></tr>`).join("");

$("board").innerHTML=stages.map(s=>{
 const cs=changes.filter(c=>c.stage===s).sort((a,b)=>b.stuck-a.stuck||b.days-a.days);
 return `<div class="col"><h3>${s}<i>${cs.length}</i></h3>`+cs.map(c=>{
  const fl=[c.stuck?'<span class="tag stuck">stuck</span>':"",qFor(c.id).length?`<span class="tag q">${qFor(c.id)[0].id}</span>`:"",c.owner==="you"?'<span class="tag you">you</span>':""].join("");
  return `<div class="card ${c.stuck?"isstuck":""}" style="--c:${color(s)}"><span class="mono">${c.id} · ${c.intent}</span><div class="t">${c.title}</div><div class="m"><span>${c.owner}</span><span class="age ${c.days>=7?"old":""}">${c.days}d in stage</span></div>${fl?`<div class="flags">${fl}</div>`:""}</div>`}).join("")+"</div>"}).join("");

// Intent progress: each change scores (stage index + 1) / stages.length
$("intents").innerHTML=intents.map(it=>{
 const cs=changes.filter(c=>c.intent===it.id);
 const pct=Math.round(100*cs.reduce((a,c)=>a+stages.indexOf(c.stage)+1,0)/(cs.length*stages.length));
 const segs=stages.map(s=>[s,cs.filter(c=>c.stage===s).length]).filter(x=>x[1]);
 const st=cs.filter(c=>c.stuck).length, qs=questions.filter(q=>cs.some(c=>c.id===q.change)).length;
 return `<div class="intent"><div><b>${it.title}</b><span class="status">${it.status}</span><br><span class="mono">${it.id} · ${cs.length} changes${st?` · <span style="color:var(--bad)">${st} stuck</span>`:""}${qs?` · ${qs} question${qs>1?"s":""}`:""}</span></div>
 <div class="bar">${segs.map(([s,n])=>`<div style="flex:${n};--c:${color(s)}" title="${s}: ${n}">${s} ${n}</div>`).join("")}</div><div class="pct">${pct}%</div></div>`}).join("");
$("legend").innerHTML=stages.map(s=>`<span style="--c:${color(s)}">${s}</span>`).join("")+'<span style="--c:transparent">Progress = average stage reached (show = 100%)</span>';
</script>
</body>
</html>
