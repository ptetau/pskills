title: "PR #212 · Apply discount codes at checkout"
subtitle: Review for mere-k · feat/discounts → main
data:
  pr: ../../../reports/R5-pr/pr.json
  files: ../../../reports/R5-pr/pr.diff
  review: ../../../reports/R5-pr/review.json
layout:
- callout: {text: "**Changes requested.** The discount logic is sound, but the code is read from the session without validation, and rounding happens twice.", tone: bad}
- stats: {data: review, by: severity, total: Findings, order: [high, medium, low]}
- row:
  - kv: {data: pr, keys: [author, base, head, commits, verdict]}
    title: Pull request
  - chart: {data: files, kind: bar, x: file, y: [added, removed], stack: true, horizontal: true}
    title: Lines changed by file
  - table: {data: files, cols: [file, status, added, removed], bar: [added, removed], fmt: {file: code}}
    title: Files changed
- table:
    data: review
    cols: [id, severity, file, line, title, comment]
    sort: -severity
    fmt: {file: code, comment: md}
  title: Findings, most serious first
- diff: {patch: ../../../reports/R5-pr/pr.diff, notes: review, mode: split}
  title: The change, with review notes
