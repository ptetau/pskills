<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PR #212 · Apply discount codes at checkout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* soft-ui page. Layout concept: a calm engineering workbench — panels on a cool ground,
   summary first, detail below; mono for data and code. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --sunk: #eef1f5; --fg: #1b2029; --muted: #5a6474;
  --faint: #8a93a3; --line: #dfe3ea; --line-2: #c9cfd9; --accent: #3651c8; --accent-ink: #ffffff;
  --s1: #257de0; --s2: #f47230; --s3: #00b894; --s4: #f2a600; --s5: #ee7fac; --s6: #008a17; --s7: #6a4ce2; --s8: #ec4647;
  --good: #0aac23; --good-ink: #006c10; --warn: #fbb315; --warn-ink: #8a5a00; --serious: #f18a59;
  --bad: #dc3c3d; --bad-ink: #b3261e; --info: #257de0; --info-ink: #1b5fb0; --neutral: #8a93a3;
  --seq-hi: #0e3d7e; --div-lo: #dc3c3d; --div-hi: #1b64be;
  --add-bg: #e6f6ea; --add-hl: #c3ebcd; --del-bg: #fdecec; --del-hl: #f8cfcf;
  --font: "IBM Plex Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px; --gap-s: 8px; --gap-m: 16px; --gap-l: 28px;
  --hl-kw: #8a2bb9; --hl-str: #0f7b3d; --hl-num: #b0510c; --hl-com: #7b8494; --hl-fn: #1f5fbf; --hl-type: #a3581a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111419; --surface: #181c23; --sunk: #1f242c; --fg: #e7eaf0; --muted: #a0a9b8; --faint: #6f7888;
    --line: #2a303a; --line-2: #3a414d; --accent: #8c9bf2; --accent-ink: #111419;
    --s1: #338ced; --s2: #e76624; --s3: #00a888; --s4: #d28e05; --s5: #e24d8b; --s6: #0aac23; --s7: #9887ef; --s8: #eb6263;
    --good-ink: #4cd364; --warn-ink: #fbc54a; --bad-ink: #f07b7b; --info-ink: #6aabf1;
    --seq-hi: #84b9f3; --div-hi: #519ced;
    --add-bg: #15301d; --add-hl: #1f4a2b; --del-bg: #3a1a1b; --del-hl: #5a2526;
    --hl-kw: #d19af3; --hl-str: #7fd59b; --hl-num: #f2a86a; --hl-com: #7d8696; --hl-fn: #82b4ff; --hl-type: #e8b37a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111419; --surface: #181c23; --sunk: #1f242c; --fg: #e7eaf0; --muted: #a0a9b8; --faint: #6f7888;
  --line: #2a303a; --line-2: #3a414d; --accent: #8c9bf2; --accent-ink: #111419;
  --s1: #338ced; --s2: #e76624; --s3: #00a888; --s4: #d28e05; --s5: #e24d8b; --s6: #0aac23; --s7: #9887ef; --s8: #eb6263;
  --good-ink: #4cd364; --warn-ink: #fbc54a; --bad-ink: #f07b7b; --info-ink: #6aabf1;
  --seq-hi: #84b9f3; --div-hi: #519ced;
  --add-bg: #15301d; --add-hl: #1f4a2b; --del-bg: #3a1a1b; --del-hl: #5a2526;
  --hl-kw: #d19af3; --hl-str: #7fd59b; --hl-num: #f2a86a; --hl-com: #7d8696; --hl-fn: #82b4ff; --hl-type: #e8b37a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); margin: 0; }
.su-page { margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.su-w-narrow { max-width: 760px; } .su-w-normal { max-width: 1180px; } .su-w-wide { max-width: 1560px; } .su-w-full { max-width: none; }
.su-head { margin-bottom: var(--gap-l); }
.su-head h1 { font-size: 26px; line-height: 1.2; margin: 0; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
.su-head .su-sub { color: var(--muted); margin: 6px 0 0; font-size: 15px; max-width: 75ch; }
.su-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.su-flow { display: flex; flex-direction: column; gap: var(--gap-l); min-width: 0; }

/* nodes */
.su-node { min-width: 0; }
.su-t { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--fg); letter-spacing: 0.01em; }
.su-note { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.su-note p { margin: 0; }
.su-scroll { overflow: auto; }
.su-leaf { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.su-leaf.su-bare { background: none; border: 0; padding: 0; }
.su-err { border: 1px solid var(--bad); background: color-mix(in oklab, var(--bad) 8%, var(--surface)); color: var(--bad-ink);
  border-radius: var(--r); padding: 10px 12px; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; }

/* layout primitives */
.su-row { display: flex; flex-wrap: wrap; align-items: stretch; }
.su-row > * { flex: var(--w, 1) 1 var(--min, 240px); min-width: 0; }
.su-row.su-al-start { align-items: flex-start; } .su-row.su-al-center { align-items: center; }
.su-col { display: flex; flex-direction: column; min-width: 0; }
.su-gap-s { gap: var(--gap-s); } .su-gap-m { gap: var(--gap-m); } .su-gap-l { gap: var(--gap-l); }
.su-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--min, 260px), 100%), 1fr)); }
.su-grid > * { grid-column: span var(--span, 1); }
@media (max-width: 760px) { .su-grid > * { grid-column: auto; } }
.su-section > h2 { font-size: 17px; font-weight: 650; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); text-wrap: balance; }
.su-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.su-card > .su-card-h { display: flex; align-items: center; gap: 8px; padding: 11px 16px; font-weight: 600; font-size: 13.5px; border-bottom: 1px solid var(--line); }
.su-card > .su-card-b { padding: 14px 16px; display: flex; flex-direction: column; gap: var(--gap-m); min-width: 0; }
.su-card .su-leaf { border: 0; padding: 0; background: none; }
.su-card.su-tone { border-left: 3px solid var(--tone); }
details.su-card > summary { cursor: pointer; list-style: none; }
details.su-card > summary::-webkit-details-marker { display: none; }
details.su-card > summary::before { content: "▸"; color: var(--faint); transition: transform .15s; display: inline-block; }
details.su-card[open] > summary::before { transform: rotate(90deg); }
details.su-card:not([open]) > summary { border-bottom: 0; }
.su-side { display: grid; grid-template-columns: var(--side-w, 300px) minmax(0, 1fr); gap: var(--gap-m); align-items: start; }
.su-side.su-at-right { grid-template-columns: minmax(0, 1fr) var(--side-w, 300px); }
.su-side.su-at-right > .su-side-a { order: 2; }
.su-side-a { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: var(--gap-m); min-width: 0; max-height: calc(100vh - 24px); overflow: auto; }
.su-side-m { display: flex; flex-direction: column; gap: var(--gap-m); min-width: 0; }
@media (max-width: 860px) { .su-side, .su-side.su-at-right { grid-template-columns: minmax(0, 1fr); } .su-side-a { position: static; max-height: none; order: 0 !important; } }
.su-float { position: fixed; z-index: 20; width: min(var(--fw, 320px), calc(100vw - 32px)); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 8px 28px rgb(0 0 0 / .16); max-height: 70vh; display: flex; flex-direction: column; }
.su-float.su-at-br { right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.su-float.su-at-bl { left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.su-float.su-at-tr { right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); }
.su-float.su-at-tl { left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); }
.su-float-h { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-weight: 600; font-size: 13px; border-bottom: 1px solid var(--line); }
.su-float-b { padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.su-float.su-min .su-float-b { display: none; }
.su-float.su-min .su-float-h { border-bottom: 0; }
.su-tabs-bar { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.su-tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; font: 500 13.5px var(--font);
  color: var(--muted); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
.su-tab:hover { color: var(--fg); }
.su-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.su-tab .su-count { margin-left: 6px; }
.su-panel { display: flex; flex-direction: column; gap: var(--gap-m); min-width: 0; }

/* controls */
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.su-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.su-ctl select, .su-ctl input { background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 8px; font-size: 13px; min-width: 0; }
.su-ctl input[type="search"] { flex: 1 1 180px; max-width: 320px; }
.su-ctl label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.su-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.su-chip { appearance: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.su-chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.su-filter { display: flex; flex-direction: column; gap: 8px; }
.su-filter-row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.su-filter-row > b { font-size: 12px; font-weight: 600; color: var(--muted); min-width: 70px; text-transform: uppercase; letter-spacing: .04em; }
.su-btn { appearance: none; border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 3px 9px; font-size: 12.5px; cursor: pointer; }

/* badges and tones */
.su-badge { display: inline-flex; align-items: center; gap: 4px; font: 500 11.5px/1.6 var(--font); padding: 0 7px; border-radius: 4px;
  background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.su-badge.su-t-good { color: var(--good-ink); background: color-mix(in oklab, var(--good) 12%, var(--surface)); border-color: color-mix(in oklab, var(--good) 35%, var(--surface)); }
.su-badge.su-t-warn { color: var(--warn-ink); background: color-mix(in oklab, var(--warn) 16%, var(--surface)); border-color: color-mix(in oklab, var(--warn) 45%, var(--surface)); }
.su-badge.su-t-bad { color: var(--bad-ink); background: color-mix(in oklab, var(--bad) 11%, var(--surface)); border-color: color-mix(in oklab, var(--bad) 35%, var(--surface)); }
.su-badge.su-t-info { color: var(--info-ink); background: color-mix(in oklab, var(--info) 11%, var(--surface)); border-color: color-mix(in oklab, var(--info) 35%, var(--surface)); }
.su-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--neutral); }
.su-t-good { --tone: var(--good); } .su-t-warn { --tone: var(--warn); } .su-t-bad { --tone: var(--bad); } .su-t-info { --tone: var(--info); } .su-t-neutral { --tone: var(--neutral); }
.su-dot.su-t-good, .su-dot.su-t-warn, .su-dot.su-t-bad, .su-dot.su-t-info { background: var(--tone); }
.su-count { font: 500 11px var(--mono); color: var(--faint); }

/* stat */
.su-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--gap-m); }
.su-stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative; }
.su-stat.su-tone { border-top: 3px solid var(--tone); padding-top: 10px; }
.su-stat-l { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.su-stat-v { font: 600 26px/1.15 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.su-stat-u { font-size: 13px; color: var(--muted); font-weight: 500; }
.su-stat-d { font: 500 12.5px var(--mono); }
.su-stat-d.su-up-good, .su-stat-d.su-down-good { color: var(--good-ink); } .su-stat-d.su-up-bad, .su-stat-d.su-down-bad { color: var(--bad-ink); }
.su-stat-s { font-size: 12px; color: var(--faint); }
.su-spark { width: 100%; height: 30px; margin-top: 6px; display: block; }
.su-spark path.l { fill: none; stroke: var(--s1); stroke-width: 1.6; }
.su-spark path.a { fill: color-mix(in oklab, var(--s1) 14%, transparent); stroke: none; }
.su-spark circle { fill: var(--s1); stroke: var(--surface); stroke-width: 1.5; }
.su-card .su-stat, .su-float .su-stat { background: var(--sunk); border-color: transparent; }

/* kv, meter, callout, text */
.su-kv { display: grid; grid-template-columns: repeat(var(--kvc, 1), minmax(0, max-content) minmax(0, 1fr)); gap: 6px 14px; margin: 0; font-size: 13.5px; }
.su-kv dt { color: var(--muted); } .su-kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.su-meter-l { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.su-meter-l span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); }
.su-meter-t { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.su-meter-f { height: 100%; background: var(--tone, var(--s1)); border-radius: 4px; }
.su-callout { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--r); border: 1px solid color-mix(in oklab, var(--tone) 40%, var(--surface));
  background: color-mix(in oklab, var(--tone) 9%, var(--surface)); }
.su-callout-i { font: 700 12px/20px var(--mono); width: 20px; height: 20px; border-radius: 50%; text-align: center; flex: none; background: var(--tone); color: var(--surface); }
.su-callout-b { min-width: 0; }
.su-callout-b > :first-child { margin-top: 0; } .su-callout-b > :last-child { margin-bottom: 0; }
.su-md { max-width: 78ch; overflow-wrap: anywhere; }
.su-md > :first-child { margin-top: 0; } .su-md > :last-child { margin-bottom: 0; }
.su-md p, .su-md ul, .su-md ol { margin: 0 0 8px; }
.su-md h3, .su-md h4 { margin: 12px 0 6px; font-size: 14px; }
.su-md code, .su-code-inline { font: 12.5px var(--mono); background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.su-md a { color: var(--accent); }

/* table */
.su-tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.su-card .su-tw, .su-float .su-tw { border-radius: 6px; }
table.su-table { border-collapse: collapse; width: 100%; font-size: 13px; }
.su-table th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-2);
  background: var(--sunk); position: sticky; top: 0; white-space: nowrap; cursor: pointer; user-select: none; }
.su-table th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; } .su-table th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
.su-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.su-table.su-dense td { padding: 4px 10px; }
.su-table tr:last-child td { border-bottom: 0; }
.su-table tbody tr:hover td { background: color-mix(in oklab, var(--accent) 4%, var(--surface)); }
.su-table .su-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.su-table .su-mono { font-family: var(--mono); font-size: 12.5px; }
.su-table tr.su-grp td { background: var(--sunk); font-weight: 600; cursor: pointer; font-size: 12.5px; }
.su-table tr.su-grp td::before { content: "▾ "; color: var(--faint); }
.su-table tr.su-grp.su-shut td::before { content: "▸ "; }
.su-cellbar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.su-cellbar i { display: block; height: 6px; border-radius: 3px; background: var(--s1); min-width: 1px; }
.su-cellbar span { min-width: 4ch; }
.su-pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.su-empty { color: var(--faint); font-size: 13px; padding: 12px; text-align: center; }

.su-table tr.su-xrow { cursor: pointer; }
.su-table tr.su-xrow td:first-child::before { content: "▸ "; color: var(--faint); }
.su-table tr.su-xrow.su-open td:first-child::before { content: "▾ "; }
.su-table tr.su-xtr td { background: var(--sunk); padding: 10px 14px 12px; }
.su-xdet { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; align-items: start; }
.su-xk { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 2px; }
.su-chip-n { margin-left: 6px; font: 500 11px var(--mono); opacity: .7; }
.su-click { cursor: pointer; } .su-click:hover { border-color: var(--line-2); }
.su-dim { opacity: .45; }
.su-heat th.su-tot { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }

/* chart */
.su-chart { position: relative; width: 100%; }
.su-chart canvas { display: block; }
.su-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.su-legend span { display: inline-flex; align-items: center; gap: 6px; }
.su-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* heatmap */
.su-heat { overflow-x: auto; }
.su-heat table { border-collapse: separate; border-spacing: 2px; font-size: 11.5px; }
.su-heat th { font-weight: 500; color: var(--muted); padding: 2px 6px; white-space: nowrap; }
.su-heat th.su-y { text-align: right; font-family: var(--mono); max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.su-heat td { min-width: 26px; height: 24px; border-radius: 3px; text-align: center; font-variant-numeric: tabular-nums; color: var(--fg); }
.su-heat td.su-hi { color: var(--surface); }
.su-scale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.su-scale i { width: 120px; height: 8px; border-radius: 4px; display: block; }

/* list */
.su-list { display: flex; flex-direction: column; gap: 8px; }
.su-item { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--tone, var(--line-2)); border-radius: 6px; padding: 10px 14px; min-width: 0; }
.su-item-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 600; font-size: 13.5px; }
.su-item-h .su-badges { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
.su-item-b { margin-top: 6px; color: var(--fg); font-size: 13px; }
.su-item pre { margin: 8px 0 0; }
details.su-item > summary { cursor: pointer; list-style: none; }
details.su-item > summary::-webkit-details-marker { display: none; }
.su-gh { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 8px 0 2px; display: flex; gap: 8px; align-items: center; }

/* board */
.su-board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.su-lane { background: var(--sunk); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.su-lane-h { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; }
.su-bcard { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--tone, var(--line-2)); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.su-bcard b { font-weight: 600; display: block; margin-bottom: 4px; }
.su-bcard .su-badges { display: flex; gap: 4px; flex-wrap: wrap; }

/* checklist */
.su-check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.su-check li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.su-check i { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line-2); flex: none; margin-top: 2px; font: 700 11px/13px var(--mono); text-align: center; font-style: normal; }
.su-check li.su-done i { background: var(--good); border-color: var(--good); color: #fff; }
.su-check li.su-done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }

/* timeline */
.su-tl { list-style: none; margin: 0; padding: 0 0 0 4px; }
.su-tl li { position: relative; padding: 0 0 14px 22px; border-left: 2px solid var(--line); }
.su-tl li:last-child { border-left-color: transparent; }
.su-tl li::before { content: ""; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--tone, var(--s1)); border: 2px solid var(--surface); }
.su-tl time { font: 500 12px var(--mono); color: var(--muted); display: block; }
.su-tl .su-badges { display: inline-flex; gap: 4px; margin-left: 6px; }

/* gantt */
.su-gantt { overflow-x: auto; font-size: 12.5px; }
.su-gantt-in { min-width: 560px; }
.su-g-row { display: grid; grid-template-columns: minmax(120px, 220px) 1fr; align-items: center; min-height: 28px; border-bottom: 1px solid var(--line); }
.su-g-row.su-g-grp { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; background: var(--sunk); }
.su-g-name { padding: 4px 10px 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.su-g-track { position: relative; height: 28px; }
.su-g-bar { position: absolute; top: 6px; height: 16px; border-radius: 4px; background: var(--tone, var(--s1)); min-width: 4px; }
.su-g-axis { display: grid; grid-template-columns: minmax(120px, 220px) 1fr; font: 11px var(--mono); color: var(--faint); border-bottom: 1px solid var(--line-2); }
.su-g-ticks { position: relative; height: 22px; }
.su-g-ticks span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
.su-g-today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--bad); z-index: 1; }

/* tree */
.su-tree { font: 12.5px/1.7 var(--mono); }
.su-tree ul { list-style: none; margin: 0; padding-left: 14px; border-left: 1px solid var(--line); }
.su-tree > ul { padding-left: 0; border: 0; }
.su-tree summary { cursor: pointer; list-style: none; }
.su-tree summary::-webkit-details-marker { display: none; }
.su-tree summary::before { content: "▸ "; color: var(--faint); }
.su-tree details[open] > summary::before { content: "▾ "; }
.su-tree .su-leafrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-left: 12px; }
.su-tree .su-badges { display: inline-flex; gap: 4px; }

/* code and diff */
pre.su-pre { margin: 0; font: 12.5px/1.55 var(--mono); background: var(--sunk); border-radius: 6px; overflow-x: auto; padding: 10px 0; }
pre.su-pre.su-wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.su-ln { display: block; padding: 0 14px 0 0; }
.su-ln::before { content: attr(data-n); display: inline-block; width: 4.5ch; margin-right: 12px; text-align: right; color: var(--faint); user-select: none; }
.su-ln.su-mark { background: color-mix(in oklab, var(--warn) 22%, transparent); box-shadow: inset 3px 0 var(--warn); }
.su-diff { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.su-diff + .su-diff { margin-top: 12px; }
.su-diff-h { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--sunk); border-bottom: 1px solid var(--line); font: 500 12.5px var(--mono); flex-wrap: wrap; }
.su-diff-h .a { color: var(--good-ink); } .su-diff-h .d { color: var(--bad-ink); }
.su-diff-w { overflow-x: auto; }
table.su-dt { border-collapse: collapse; width: 100%; font: 12px/1.5 var(--mono); table-layout: fixed; }
table.su-dt td { padding: 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; vertical-align: top; }
table.su-dt td.n { width: 4.5ch; color: var(--faint); text-align: right; user-select: none; padding: 0 6px; white-space: nowrap; }
table.su-dt td.m { width: 2ch; color: var(--faint); user-select: none; padding: 0 2px; }
table.su-dt tr.hk td { background: color-mix(in oklab, var(--info) 8%, var(--surface)); color: var(--muted); padding: 3px 8px; }
table.su-dt td.add { background: var(--add-bg); } table.su-dt td.del { background: var(--del-bg); }
table.su-dt td.add mark { background: var(--add-hl); color: inherit; border-radius: 2px; }
table.su-dt td.del mark { background: var(--del-hl); color: inherit; border-radius: 2px; }
table.su-dt td.emp { background: var(--sunk); }
table.su-dt.split col.code { width: calc(50% - 6.5ch); }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword { color: var(--hl-kw); }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute { color: var(--hl-str); }
.hljs-number, .hljs-literal, .hljs-symbol { color: var(--hl-num); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--hl-fn); }
.hljs-type, .hljs-built_in, .hljs-title.class_, .hljs-attr, .hljs-variable, .hljs-template-variable { color: var(--hl-type); }
.hljs-deletion { color: var(--bad-ink); }

.su-cnote { margin: 6px 10px 8px; padding: 8px 12px; border: 1px solid color-mix(in oklab, var(--tone) 35%, var(--surface)); border-left: 3px solid var(--tone);
  background: var(--surface); border-radius: 6px; font: 13px/1.5 var(--font); white-space: normal; }
.su-cnote-h { display: flex; gap: 8px; align-items: center; margin-bottom: 2px; }
pre.su-pre .su-cnote { margin: 4px 14px 6px 5.5ch; }
tr.su-ntr td { background: var(--sunk); padding: 0; }
.su-cnotes { padding: 8px 4px; border-top: 1px solid var(--line); }

/* diagram */
.su-diagram { overflow-x: auto; text-align: center; }
.su-diagram svg { max-width: 100%; height: auto; }
.su-diagram.su-pending { min-height: 60px; color: var(--faint); font-size: 12px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 560px) { .su-head h1 { font-size: 22px; } .su-stat-v { font-size: 22px; } .su-float { position: static; width: auto; max-height: none; box-shadow: none; } }

<script>
/* soft-ui runtime: draws the checked plan in #su-plan into #su-root. No build step. */
(function () {
  "use strict";
  const PLAN = JSON.parse(document.getElementById("su-plan").textContent);
  const DS = PLAN.data || {};
  const ST = (window.__softui = { done: false, errors: [], nodes: 0 });
  const FILT = {};           // dataset -> {f: {col: Set}, q: ""}
  const SUBS = {};           // dataset -> [rerender]
  const LIVE = [];           // rerender on theme change (charts, diagrams)
  const PENDING = [];        // diagrams waiting to be visible
  const WAIT = [];           // promises the done flag waits for
  let uid = 0;

  // ---- helpers --------------------------------------------------------------------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k.startsWith("--")) el.style.setProperty(k, v);

    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const arr = (v) => (v == null ? [] : Array.isArray(v) ? v : [v]);
  const colKey = (c) => (typeof c === "object" ? c.key : c);

  function inline(s) {
    const codes = [];
    s = String(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    s = esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/(^|[\s(])_([^_\s][^_]*)_/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(((?:https?:\/\/|#)[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
  }
  function md(src) {
    const out = [], lines = String(src == null ? "" : src).replace(/\r/g, "").split("\n");
    let para = [], list = null, code = null;
    const flushP = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
    const flushL = () => { if (list) { out.push(`<${list.t}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.t}>`); list = null; } };
    for (const ln of lines) {
      if (code) { if (/^\s*```/.test(ln)) { out.push('<pre class="su-pre su-wrap"><code>' + esc(code.join("\n")) + "</code></pre>"); code = null; } else code.push(ln); continue; }
      if (/^\s*```/.test(ln)) { flushP(); flushL(); code = []; continue; }
      let m;
      if (!ln.trim()) { flushP(); flushL(); continue; }
      if ((m = ln.match(/^(#{1,4})\s+(.*)/))) { flushP(); flushL(); out.push(`<h${Math.min(4, m[1].length + 2)}>` + inline(m[2]) + `</h${Math.min(4, m[1].length + 2)}>`); continue; }
      if ((m = ln.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))) {
        flushP(); const t = /\d/.test(m[1]) ? "ol" : "ul";
        if (!list || list.t !== t) { flushL(); list = { t, items: [] }; }
        list.items.push(m[2].replace(/^\[( |x)\]\s*/i, (_, x) => (x.trim() ? "☑ " : "☐ "))); continue;
      }
      if ((m = ln.match(/^>\s?(.*)/))) { flushP(); flushL(); out.push('<p style="color:var(--muted)">' + inline(m[1]) + "</p>"); continue; }
      if (list && /^\s{2,}\S/.test(ln)) { list.items[list.items.length - 1] += " " + ln.trim(); continue; }
      flushL(); para.push(ln.trim());

    if (code) out.push('<pre class="su-pre"><code>' + esc(code.join("\n")) + "</code></pre>");
    flushP(); flushL();
    return out.join("");
  }

  const TONE_SYN = { red: "bad", danger: "bad", error: "bad", critical: "bad", fail: "bad", green: "good", success: "good", ok: "good", pass: "good",
    yellow: "warn", amber: "warn", orange: "warn", warning: "warn", blue: "info", grey: "neutral", gray: "neutral", muted: "neutral", none: "neutral" };
  const normTone = (t) => { if (!t) return null; t = String(t).toLowerCase(); t = TONE_SYN[t] || t; return ["good", "warn", "bad", "info", "neutral"].includes(t) ? t : null; };
  const AUTO = { critical: "bad", blocker: "bad", high: "bad", severe: "bad", fail: "bad", failed: "bad", failing: "bad", error: "bad", broken: "bad", blocked: "bad", late: "bad", red: "bad", vulnerable: "bad", regressed: "bad", regression: "bad",
    medium: "warn", moderate: "warn", warn: "warn", warning: "warn", flaky: "warn", stuck: "warn", "at-risk": "warn", "at risk": "warn", skipped: "warn", pending: "warn", partial: "warn", amber: "warn", review: "warn",
    low: "info", minor: "info", info: "info", "in progress": "info", "in-progress": "info", building: "info", running: "info",
    pass: "good", passed: "good", passing: "good", ok: "good", done: "good", success: "good", fixed: "good", green: "good", merged: "good", shipped: "good", improved: "good", resolved: "good", verified: "good" };
  const SEV = ["critical", "blocker", "high", "severe", "major", "error", "fail", "failed", "medium", "moderate", "warn", "warning", "low", "minor", "info", "none"];
  const sevRank = (v) => SEV.indexOf(String(v).toLowerCase());
  function cmp(a, b) {
    if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
    const ra = sevRank(a), rb = sevRank(b);
    if (ra >= 0 && rb >= 0) return ra - rb;

  }
  function autoTone(ds, col) {
    const d = DS[ds]; if (!d || !col) return false;
    const vals = new Set(d.rows.map((r) => r[col]).filter((v) => v != null).map((v) => String(v).toLowerCase()));
    return vals.size > 0 && vals.size <= 12 && [...vals].every((v) => v in AUTO);
  }
  function toneOf(p, row, ds, cols) {
    if (p.tone && typeof p.tone === "object") for (const c in p.tone) {
      const m = p.tone[c], v = row[c];
      if (m && typeof m === "object" && v != null) {
        const t = m[v] ?? m[String(v)] ?? m[String(v).toLowerCase()];
        if (t) return normTone(t);
      }
    }
    for (const c of arr(cols)) if (autoTone(ds, c)) return normTone(AUTO[String(row[c]).toLowerCase()]);
    return null;
  }
  function cellTone(p, ds, col, v) {
    if (v == null) return null;
    const m = p.tone && p.tone[col];
    if (m) return normTone(m[v] ?? m[String(v)] ?? m[String(v).toLowerCase()]);
    if (autoTone(ds, col)) return normTone(AUTO[String(v).toLowerCase()]);
    return null;
  }
  function badge(text, tone, title) { return h("span", { class: "su-badge" + (tone ? " su-t-" + tone : ""), title }, text); }

  function fmt(v, f, t) {
    if (v == null || v === "") return "";
    if (Array.isArray(v)) return v.join(", ");
    if (typeof v === "object") return JSON.stringify(v);
    const n = typeof v === "number" ? v : (typeof v === "string" && /^[+-]?\d+(\.\d+)?$/.test(v) ? +v : NaN);
    switch (f) {
      case "int": return isNaN(n) ? String(v) : Math.round(n).toLocaleString("en");
      case "num": return isNaN(n) ? String(v) : n.toLocaleString("en", { maximumFractionDigits: 2 });
      case "pct": return isNaN(n) ? String(v) : n.toLocaleString("en", { maximumFractionDigits: 1 }) + "%";

  }
  function codeEl(p) {
    const lines = splitHtmlLines(hl(String(p.src ?? ""), p.lang));
    const marks = new Set(arr(p.mark).map(Number)), start = p.start || 1;
    const pre = h("pre", { class: "su-pre" + (p.wrap ? " su-wrap" : "") });
    const code = h("code");
    code.innerHTML = lines.map((l, i) => `<span class="su-ln${marks.has(start + i) ? " su-mark" : ""}" data-n="${start + i}">${l || " "}</span>`).join("");

  }
  function noteRow(n, span) {
    const t = normTone(AUTO[String(n.sev ?? "").toLowerCase()] || n.sev) || "info";
    const card = h("div", { class: "su-cnote su-t-" + t, style: { "--tone": `var(--${t})` } },
      h("div", { class: "su-cnote-h" }, n.id != null ? h("span", { class: "su-count" }, String(n.id)) : null, n.sev ? badge(String(n.sev), t) : null, n.head ? h("b", { html: inline(n.head) }) : null),
      n.text ? h("div", { class: "su-md", html: md(n.text) }) : null);

  }
  C.code = (p, el) => {
    const pre = codeEl(p);
    if (p.notes) {
      const by = new Map(); for (const n of p.notes) { const k = +n.line; if (!by.has(k)) by.set(k, []); by.get(k).push(n); }
      const code = pre.querySelector("code");
      for (const ln of [...code.children]) { const ns = by.get(+ln.dataset.n); if (ns) { ln.classList.add("su-mark"); ns.forEach((n) => ln.after(noteRow(n))); } }
    }
    el.append(pre);
  };
  function intraline(a, b) {
    let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
    let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
    const mk = (s) => esc(s.slice(0, i)) + (s.length - j > i ? "<mark>" + esc(s.slice(i, s.length - j)) + "</mark>" : "") + esc(s.slice(s.length - j));
    if (i + j < Math.min(a.length, b.length) * 0.3) return [esc(a), esc(b)];
    return [mk(a), mk(b)];
  }
  C.diff = (p, el) => {
    const split = (p.mode || "split") === "split";
    const notesFor = (f) => {
      const m = new Map();
      for (const n of arr(p.notes)) {
        if (n.file && !(f.new && (f.new === n.file || f.new.endsWith("/" + n.file) || String(n.file).endsWith(f.new))) && !(f.old && f.old === n.file)) continue;
        if (!n.file && arr(p.files).length > 1) continue;
        const k = +n.line; if (!m.has(k)) m.set(k, []); m.get(k).push(n);
      }
      return m;
    };
    for (const f of arr(p.files)) {
      const lang = p.lang || f.lang;
      const NOTES = notesFor(f), used = new Set(), tb = h("tbody");
      const after = (num) => { if (num == null || !NOTES.has(num) || used.has(num)) return; used.add(num); NOTES.get(num).forEach((n) => tb.append(noteRow(n, split ? 6 : 4))); };
      const name = f.new && f.old && f.new !== f.old ? `${f.old} → ${f.new}` : f.new || f.old || "file";
      const box = h("div", { class: "su-diff" }, h("div", { class: "su-diff-h" }, h("span", null, name), h("span", { class: "a" }, "+" + f.add), h("span", { class: "d" }, "−" + f.del),
        !f.old ? badge("new", "good") : !f.new ? badge("deleted", "bad") : null, NOTES.size ? h("span", { class: "su-count" }, `${[...NOTES.values()].flat().length} notes`) : null));
      const t = h("table", { class: "su-dt" + (split ? " split" : "") });
      t.append(h("colgroup", null, split ? [h("col", { style: { width: "5ch" } }), h("col", { style: { width: "2ch" } }), h("col", { class: "code" }), h("col", { style: { width: "5ch" } }), h("col", { style: { width: "2ch" } }), h("col", { class: "code" })]
        : [h("col", { style: { width: "5ch" } }), h("col", { style: { width: "5ch" } }), h("col", { style: { width: "2ch" } }), h("col")]));
      const td = (cls, html) => h("td", { class: cls, html });
      for (const hk of f.hunks) {
        const first = hk.lines[0] || [];
        tb.append(h("tr", { class: "hk" }, h("td", { colspan: split ? 6 : 4 }, `@@ ${first[1] ?? first[2] ?? ""} ${hk.head || ""}`)));
        const L = hk.lines;
        for (let i = 0; i < L.length;) {
          if (L[i][0] === "c") {
            const code = hl(L[i][3], lang);
            tb.append(split ? h("tr", null, td("n", L[i][1]), td("m", ""), td("", code), td("n", L[i][2]), td("m", ""), td("", code))
              : h("tr", null, td("n", L[i][1]), td("n", L[i][2]), td("m", ""), td("", code)));
            after(L[i][2]); i++; continue;
          }
          const dels = [], adds = [];
          while (i < L.length && L[i][0] === "d") dels.push(L[i++]);
          while (i < L.length && L[i][0] === "a") adds.push(L[i++]);
          const n = Math.max(dels.length, adds.length);
          for (let k = 0; k < n; k++) {
            const d = dels[k], a = adds[k];
            let dh = d ? hl(d[3], lang) : "", ah = a ? hl(a[3], lang) : "";
            if (d && a) [dh, ah] = intraline(d[3], a[3]);
            if (split) { tb.append(h("tr", null, d ? [td("n del", d[1]), td("m del", "−"), td("del", dh)] : [td("n emp", ""), td("m emp", ""), td("emp", "")],
              a ? [td("n add", a[2]), td("m add", "+"), td("add", ah)] : [td("n emp", ""), td("m emp", ""), td("emp", "")])); if (a) after(a[2]); }
          }
          if (!split) {
            dels.forEach((d, k) => tb.append(h("tr", null, td("n del", d[1]), td("n del", ""), td("m del", "−"), td("del", adds[k] ? intraline(d[3], adds[k][3])[0] : hl(d[3], lang)))));
            adds.forEach((a, k) => { tb.append(h("tr", null, td("n add", ""), td("n add", a[2]), td("m add", "+"), td("add", dels[k] ? intraline(dels[k][3], a[3])[1] : hl(a[3], lang)))); after(a[2]); });
          }
        }
      }
      t.append(tb);
      const left = [...NOTES.keys()].filter((k) => !used.has(k));
      box.append(h("div", { class: "su-diff-w" }, t));
      if (left.length) box.append(h("div", { class: "su-cnotes" }, h("div", { class: "su-gh" }, "Notes on lines outside the diff"), left.flatMap((k) => NOTES.get(k).map((n) => noteRow({ ...n, head: `L${k} · ${n.head || ""}` })))));
      el.append(box);
    }
    if (!arr(p.files).length) el.append(h("div", { class: "su-empty" }, "No changes."));
  };

  // ---- diagrams -------------------------------------------------------------------
  let mermaidReady = false;
  function mermaidInit() {
    if (!window.mermaid) return false;
    const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light" || document.documentElement.dataset.theme === "dark";
    mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", theme: "base", fontFamily: css("--font"),
      themeVariables: { darkMode: dark, background: css("--surface"), primaryColor: css("--sunk"), primaryBorderColor: css("--line-2"), primaryTextColor: css("--fg"),
        secondaryColor: css("--surface"), tertiaryColor: css("--bg"), lineColor: css("--muted"), textColor: css("--fg"), fontSize: "13px",
        clusterBkg: css("--bg"), clusterBorder: css("--line-2"), noteBkgColor: css("--sunk"), noteTextColor: css("--fg"), noteBorderColor: css("--line-2"),
        actorBkg: css("--sunk"), actorBorder: css("--line-2"), actorTextColor: css("--fg"), signalColor: css("--fg"), signalTextColor: css("--fg"),
        labelBoxBkgColor: css("--sunk"), labelBoxBorderColor: css("--line-2"), labelTextColor: css("--fg"), loopTextColor: css("--fg"), activationBkgColor: css("--line"),
        edgeLabelBackground: css("--surface"), classText: css("--fg") },
      flowchart: { htmlLabels: true, curve: "basis" }, sequence: { useMaxWidth: true }, themeCSS: ".node rect, .node polygon { rx: 6; ry: 6; }",
    });
    mermaidReady = true; return true;
  }
  async function drawDiagram(job) {
    const { el, src, path } = job;
    if (!window.mermaid) { el.replaceChildren(h("div", { class: "su-err" }, "Mermaid did not load (no network?).")); return; }
    if (!mermaidReady) mermaidInit();
    const id = "su-m" + ++uid;
    try {
      const { svg } = await mermaid.render(id, src);
      el.classList.remove("su-pending"); el.innerHTML = svg;
    } catch (e) {
      document.getElementById("d" + id)?.remove(); document.getElementById(id)?.remove();
      const msg = String(e && e.message || e).split("\n").slice(0, 6).join("\n");
      ST.errors.push(`${path}: Mermaid error: ${msg}`);
      el.classList.remove("su-pending");
      el.replaceChildren(h("div", { class: "su-err" }, `Diagram error at ${path}:\n${msg}`), h("pre", { class: "su-pre su-wrap" }, h("code", null, src)));
    }
  }
  const visible = (el) => !!(el.offsetParent || el.getClientRects().length);
  function flushPending() {
    for (let i = PENDING.length - 1; i >= 0; i--) if (visible(PENDING[i].el)) { const j = PENDING.splice(i, 1)[0]; WAIT.push(drawDiagram(j)); }
  }
  C.diagram = (p, el, n, path) => {
    const box = h("div", { class: "su-diagram su-pending" }, "Drawing diagram…"); el.append(box);
    const job = { el: box, src: p.src, path };

    LIVE.push(() => { if (!PENDING.includes(job)) { mermaidReady = false; PENDING.push(job); } });
  };
  C.graph = C.diagram;

  // ---- layout ---------------------------------------------------------------------
  function kidsInto(container, kids, path) { kids.forEach((k, i) => container.append(node(k, `${path}[${i}]`))); return container; }
  const L = {};
  L.row = (n, path) => {
    const el = h("div", { class: `su-row su-gap-${n.p.gap || "m"}` + (n.p.align ? " su-al-" + n.p.align : ""), "--min": (n.p.min || 240) + "px" });
    n.kids.forEach((k, i) => { const c = node(k, `${path}[${i}]`); if (k.p.w) c.style.setProperty("--w", k.p.w); el.append(c); });
    return titled(n, el);
  };
  L.col = (n, path) => titled(n, kidsInto(h("div", { class: `su-col su-gap-${n.p.gap || "m"}` }), n.kids, path));
  L.grid = (n, path) => {
    const el = h("div", { class: `su-grid su-gap-${n.p.gap || "m"}`, "--min": (n.p.min || 260) + "px", style: n.p.cols ? { gridTemplateColumns: `repeat(${n.p.cols}, minmax(0, 1fr))` } : null });

  };
  L.section = (n, path) => h("section", { class: "su-section su-node", id: n.p.id }, n.p.title ? h("h2", null, n.p.title) : null, kidsInto(h("div", { class: "su-flow", style: { gap: "var(--gap-m)" } }), n.kids, path), noteEl(n));
  L.card = (n, path) => {
    const t = normTone(n.p.tone);

    const body = kidsInto(h("div", { class: "su-card-b" }), n.kids, path);
    const el = h(n.p.collapse ? "details" : "div", { class: "su-card su-node" + (t ? " su-tone su-t-" + t : ""), id: n.p.id, open: n.p.collapse ? n.p.open === true : null }, head, body, noteEl(n, true));

  function countOf(n) {

    return null;
  }
  const rowsForStatic = (k) => rowsFor(k.p).length;
  L.tabs = (n, path) => {

  const root = document.getElementById("su-root");
  if (PLAN.accent) document.documentElement.style.setProperty("--accent", PLAN.accent);
  const head = h("header", { class: "su-head" }, h("h1", null, PLAN.title), PLAN.subtitle ? h("p", { class: "su-sub", html: inline(PLAN.subtitle) }) : null,
    PLAN.meta && PLAN.meta.length ? h("div", { class: "su-meta" }, PLAN.meta.map((m) => badge(String(m)))) : null);
  const flow = h("main", { class: "su-flow" });
  PLAN.layout.forEach((n, i) => flow.append(node(n, `layout[${i}]`)));

  const rerenderLive = () => { mermaidReady = false; LIVE.forEach((fn) => { try { fn(); } catch (e) { /* drawn again later */ } }); flushPending(); };

</script>
